<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- STYLE: Inked story map at night (indigo ink, gold leaf, Cormorant Garamond with Inter) | WHY: Jeffrey is a narrative director who came to Gordon's CTIN 463 in November 2025 to talk with students about story, so the gift is a tale that branches at every fork and still finds its way home | ALT: Blizzard-style fantasy tavern, rejected because the gift is about his craft, not his employer -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Every Fork</title>
<meta name="description" content="A branching tale for Jeffrey.">
<meta property="og:title" content="Every Fork, for Jeffrey">
<meta property="og:image" content="https://gordonusc.github.io/gift-yohalem/img/hero.jpg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@500;700&display=swap">
<style>
:root{--gold:#e9c46a;--ink:#0d1433;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070a1c;color:#f4ead2;font:15px/1.45 Inter,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.stage{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100svh*9/16));overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.62)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 16px);text-align:center;padding:0 18px;text-shadow:0 2px 14px #000}
.top small{font-weight:700;font-size:11px;letter-spacing:.3em;color:var(--gold)}
.top h1{font:700 clamp(36px,11vw,52px)/1 "Cormorant Garamond",Georgia,serif;margin:4px 0}
.page{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);background:#0d1433e8;border:1px solid #e9c46a88;border-radius:14px;padding:16px 16px 14px;box-shadow:0 10px 30px #000a}
.tale{font:italic 500 19px/1.35 "Cormorant Garamond",Georgia,serif;min-height:3.9em;transition:opacity .35s}
.tale.fade{opacity:0}
.forks{display:flex;gap:10px;margin-top:12px}
.forks button{flex:1;min-width:0;border:1px solid var(--gold);background:#e9c46a1a;color:#fff3d6;border-radius:10px;padding:11px 8px;font:700 13px/1.25 Inter,sans-serif;cursor:pointer}
.forks button:active{transform:scale(.97)}
.step{margin-top:8px;font-size:11px;letter-spacing:.2em;color:var(--gold);text-align:center}
.foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);text-align:center;font-size:11px;opacity:.7}
</style>
</head>
<body>
<div class="stage">
  <img class="bg" src="img/hero.jpg" alt="An inked fantasy map on parchment where one road branches again and again past a castle, a lighthouse and the sea">
  <canvas id="c"></canvas>
  <div class="top"><small>FOR JEFFREY</small><h1>Every Fork</h1></div>
  <div class="page" id="page">
    <div class="tale" id="tale">A traveler stands where the road splits for the first time. The lantern is lit. The story is yours to steer. Sound on.</div>
    <div class="forks" id="forks"><button type="button" data-i="0">Follow the river</button><button type="button" data-i="1">Climb to the castle</button></div>
    <div class="step" id="step">FORK 1 OF 3</div>
  </div>
  <div class="foot">made by Darby, Gordon's AI assistant, with love from Gordon</div>
</div>
<script>
// ElevenLabs sound design: quill strokes, page turn, storybook harp theme. Code only mixes.
const SND=['quill','page','bed'];
let ac=null, master=null, bufs={};
function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination); SND.forEach(load);}catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
async function load(n){ if(bufs[n]) return bufs[n]; try{ const r=await fetch('snd/'+n+'.mp3'); const a=await r.arrayBuffer(); bufs[n]=await new Promise((ok,no)=>ac.decodeAudioData(a,ok,no)); }catch(e){} return bufs[n]; }
async function play(n,vol=1,loop=false,rate=1){ if(!audio()) return null; const b=await load(n); if(!b) return null; const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=b; s.loop=loop; s.playbackRate.value=rate; g.gain.value=vol; s.connect(g).connect(master); s.start(); return {s,g}; }
const FORKS=[
  {a:['The river carries the traveler past sleeping villages, each one with a story it never told.','On the castle stair, a guard asks the traveler a question no one has asked in a hundred years.'], next:[['Wake the villages','Keep to the current'],['Answer honestly','Answer with a riddle']]},
  {a:['Doors open. Lamps glow. The traveler learns that every listener changes the tale.','The traveler keeps moving, and the world rewrites itself to keep up.','The guard laughs, and the gate opens onto a library made of choices.','The riddle echoes, and the walls begin to tell their own stories back.'], next:[['Head for the lighthouse','Head for the sea'],['Head for the lighthouse','Head for the sea'],['Head for the lighthouse','Head for the sea'],['Head for the lighthouse','Head for the sea']]},
];
let path=[], pts=[];
const c=document.getElementById('c'), x=c.getContext('2d'), D=Math.min(devicePixelRatio||1,2);
function size(){ c.width=c.clientWidth*D; c.height=c.clientHeight*D; } size(); addEventListener('resize',size);
const tale=document.getElementById('tale'), forks=document.getElementById('forks'), step=document.getElementById('step');
function say(t){ tale.classList.add('fade'); setTimeout(()=>{ tale.textContent=t; tale.classList.remove('fade'); },300); }
let bedOn=false;
forks.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; audio(); if(!bedOn){ bedOn=true; play('bed',.4); }
  const i=+b.dataset.i; path.push(i); play('quill',.85,false,.95+path.length*.05); setTimeout(()=>play('page',.6),250);
  const lvl=path.length, last=pts.length?pts[pts.length-1]:{u:.5,v:.86}; pts.push({u:Math.min(.85,Math.max(.15,last.u+(i?.16:-.16))),v:.86-lvl*.17,t:performance.now()});
  if(lvl===1){ say(FORKS[0].a[i]); setBtns(FORKS[0].next[i]); step.textContent='FORK 2 OF 3'; }
  else if(lvl===2){ const k=path[0]*2+i; say(FORKS[1].a[k]); setBtns(FORKS[1].next[k]); step.textContent='FORK 3 OF 3'; }
  else { forks.remove(); step.textContent='THE END, WHICHEVER WAY YOU WENT';
    say((i?'At the edge of the sea':'At the top of the lighthouse')+', the traveler finds a classroom of young storytellers, and realizes every fork led here. Jeffrey, thank you for showing Gordon’s students how stories branch.');
    setTimeout(()=>{ play('page',.8,false,.8); },400); } });
function setBtns(t){ forks.innerHTML=t.map((s,k)=>'<button type="button" data-i="'+k+'">'+s+'</button>').join(''); }
(function loop(now){ x.clearRect(0,0,c.width,c.height); let prev={u:.5,v:.86};
  pts.forEach(p=>{ const k=Math.min(1,(now-p.t)/900); const ax=prev.u*c.width, ay=prev.v*c.height, bx=ax+(p.u*c.width-ax)*k, by=ay+(p.v*c.height-ay)*k;
    x.strokeStyle='#e9c46a'; x.lineWidth=4*D; x.setLineDash([2*D,8*D]); x.shadowColor='#ffd27a'; x.shadowBlur=12*D; x.beginPath(); x.moveTo(ax,ay); x.lineTo(bx,by); x.stroke(); x.setLineDash([]);
    if(k>=1){ const fl=.7+.3*Math.sin(now/180+p.u*9); x.fillStyle='rgba(255,210,122,'+fl+')'; x.beginPath(); x.arc(bx,by,7*D,0,7); x.fill(); }
    x.shadowBlur=0; prev=p; });
  requestAnimationFrame(loop); })(0);
</script>
</body>
</html>
